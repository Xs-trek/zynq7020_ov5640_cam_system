# /etc/cam_system.conf - cam_system runtime configuration.
#
# Format: one "key = value" per line; "#" starts a comment.  Every key is optional; the value shown in each
# comment is the built-in default.  Unknown keys and out-of-range values stop cam_system at start-up.
# An environment variable of the same parameter (named in brackets) overrides this file; use that only
# for debugging.

# Capture
# capture.device = (empty: first frmbuf V4L2 node)        [CAM_CAPTURE_DEV]
# capture.skip_media_setup = 0                             [CAM_CAPTURE_SKIP_MEDIA_SETUP]
# capture.test_pattern = 0             (sensor color bars) [CAM_CAPTURE_TEST_PATTERN]
# capture.max_stream_min = 20         (0..600, 0 = no limit: the camera turns off after this long)  [CAM_CAPTURE_MAX_STREAM_MIN]
# capture.log_every = 0                (frames, 0 = off)   [CAM_CAPTURE_LOG_EVERY]
# ov5640.subdev = (empty: discover by name)                [CAM_OV5640_SUBDEV]

# Control tick: while tracking, wait for this frame's detection at most this long after the frame.
# control.deadline_ms = 24             (0..30, 0 = no wait)  [CAM_CONTROL_DEADLINE_MS]

# Detector
# detector.backend = face_accel       (CPU models only in CPU-detector builds)  [CAM_DETECTOR_BACKEND]
# detector.fps = 30                    (1..30)             [CAM_DETECTOR_FPS]
# detector.log_every = 0               (frames, 0 = off)   [CAM_DETECTOR_LOG_EVERY]
# detector.retry_limit = 3             (1..100: failed jobs before a device reset)  [CAM_DETECTOR_RETRY_LIMIT]
# detector.backoff_max_sec = 8         (0.5..300: longest wait between reopen attempts)  [CAM_DETECTOR_BACKOFF_MAX_SEC]

# Face detection post-processing and temporal filter
# face.score_thresh = 0.8              (0..1)              [CAM_FACE_SCORE_THRESH]
# face.track_score_thresh = 0.6        (0..1)              [CAM_FACE_TRACK_SCORE_THRESH]
# face.nms_thresh = 0.3                (0..1)              [CAM_FACE_NMS_THRESH]
# face.timeout_ms = 250                (1..2000)           [CAM_FACE_TIMEOUT_MS]
# face.zero_copy = 1                   (0|1)               [CAM_FACE_ZERO_COPY]
# face.confirm_frames = 3              (1..10)             [CAM_FACE_CONFIRM_FRAMES]
# face.max_misses = 2                  (0..10)             [CAM_FACE_MAX_MISSES]
# face.temporal_iou = 0.15             (0..1)              [CAM_FACE_TEMPORAL_IOU]
# face.diag_log_every = 0              (0..10000)          [CAM_FACE_DIAG_LOG_EVERY]
# face.diag_repeat = 0                 (0..500)            [CAM_FACE_DIAG_REPEAT]
# face.diag_reset_repeat = 0           (0..100)            [CAM_FACE_DIAG_RESET_REPEAT]

# Streaming (page display only; capture, detection and tracking are not affected)
# jpeg.quality = 70                    (20..95)            [CAM_JPEG_QUALITY]
# jpeg.log_every = 0                   (frames, 0 = off)   [CAM_JPEG_LOG_EVERY]
# stream.max_fps = 0                   (0..30, 0 = every frame; 30/n: 15, 10, 7, 6, 5 ...)  [CAM_STREAM_MAX_FPS]

# Tracking controller
# tracker.diag_every_sec = 0           (0 = off)           [CAM_TRACKER_DIAG_EVERY]
# tracker.verbose = 0                                      [CAM_TRACKER_VERBOSE]
# tracker.trace =                       (file under /tmp, "" = off; numbers only)  [CAM_TRACKER_TRACE]

# Logging
# log.level = info                     (error|warn|info|debug)  [CAM_LOG_LEVEL]
# log.target = stderr                  (stderr|syslog)          [CAM_LOG_TARGET]
